services:
  db:
    image: postgres:15-alpine
    container_name: app_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - app_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: app_backend
    restart: unless-stopped
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - DEBUG=${DJANGO_DEBUG:-1}
      - SECRET_KEY=${DJANGO_SECRET_KEY}
      - DATABASE_URL=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started
    networks:
      - app_network

  # Le "facteur" des emails : toutes les 30 secondes, il envoie les notifications de la cloche qui attendent
  # (employees/emails.py). Le même code que le backend ; après un changement de ce code : docker compose restart mailer.
  mailer:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: app_mailer
    restart: unless-stopped
    command: python manage.py send_emails --loop 30
    volumes:
      - ./backend:/app
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started
    networks:
      - app_network

  # Une boîte email de TEST (développement) : elle garde tous les emails envoyés par Django, sans les
  # envoyer à personne. Les lire : http://localhost:8025. En production : le serveur email de la société
  # (Microsoft 365), réglé dans .env (EMAIL_HOST...), et ce service n'est plus utilisé.
  mailpit:
    image: axllent/mailpit:v1.21.8
    container_name: app_mailpit
    restart: unless-stopped
    ports:
      - "8025:8025"   # la page web pour lire les emails
    networks:
      - app_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: app_frontend
    restart: unless-stopped
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      - backend
    networks:
      - app_network

volumes:
  postgres_data:

networks:
  app_network:
    driver: bridge
